[package]
name = "corevia-talk-pairing-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI tool for NIP-AB device pairing interop testing"

[[bin]]
name = "corevia-talk-pair"
path = "src/main.rs"

[dependencies]
corevia-talk-core = { workspace = true }
nostr = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
hex = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
thiserror = { workspace = true }
zeroize = { workspace = true }

# Explicit rustls dep with ring provider — required to install the process-level
# CryptoProvider at startup. Without this, `corevia-talk-pair` panics on any `wss://`
# relay (including the default `wss://relay.damus.io`) when a multi-package
# release build unifies both ring and aws-lc-rs features. See crates/corevia-talk-cli.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

