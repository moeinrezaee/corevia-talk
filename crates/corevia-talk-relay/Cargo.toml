[package]
name = "corevia-talk-relay"
default-run = "corevia-talk-relay"
# Independent version: corevia-talk-relay ships as a pinnable artifact
# (ghcr.io/block/buzz), released on its own cadence via `just release-relay`.
# It does NOT inherit the workspace version.
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "WebSocket relay server for the Corevia Talk communications platform"

[[bin]]
name = "corevia-talk-relay"
path = "src/main.rs"

[dependencies]
corevia-talk-core = { workspace = true }
corevia-talk-conformance = { workspace = true }
corevia-talk-db = { workspace = true }
corevia-talk-datastore-tracing = { workspace = true }
corevia-talk-deletion = { workspace = true }
corevia-talk-auth = { workspace = true }
jsonwebtoken = { workspace = true }
corevia-talk-pubsub = { workspace = true }
corevia-talk-audit = { workspace = true }
corevia-talk-search = { workspace = true }
corevia-talk-relay-mesh = { workspace = true }
async-trait = "0.1"
postcard = { workspace = true }
axum = { workspace = true }
# Axum's WebSocket errors wrap tungstenite's; matching them tells a close
# handshake already under way apart from a failed terminal-frame write.
tungstenite = { version = "0.29", default-features = false }
tokio = { workspace = true }
# `io` (ReaderStream) is needed to stream git subprocess stdout straight into
# the HTTP response body — see api::git::transport read-path streaming. The
# workspace default only enables rt+codec.
tokio-util = { workspace = true, features = ["io"] }
tower = { workspace = true }
tower-http = { workspace = true }
nostr = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = "0.7"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
dashmap = { workspace = true }
futures-util = { workspace = true }
deadpool-redis = { workspace = true }
redis = { workspace = true }
# Redis TLS (rediss://, e.g. ElastiCache) uses rustls, which needs a process
# CryptoProvider installed at startup. Both aws-lc-rs and ring are compiled in
# transitively, so rustls can't auto-select one — we install ring explicitly in
# main(). Mirrors corevia-talk-acp's rustls setup for wss://.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
sqlx = { workspace = true }
reqwest = { workspace = true }
base64 = "0.22"
corevia-talk-sdk = { workspace = true }
corevia-talk-workflow = { workspace = true, features = ["reqwest"] }
corevia-talk-media = { workspace = true }
s3 = { version = "0.37", package = "rust-s3", default-features = false, features = ["tokio-rustls-tls", "fail-on-err", "tags"] }
tempfile = "3"
bytes = "1"
infer = "0.19"
serde_yaml      = { workspace = true }
sha2            = { workspace = true }
hmac            = { workspace = true }
subtle          = { workspace = true }
rand            = { workspace = true }
hex             = { workspace = true }
url             = { workspace = true }
moka            = { workspace = true }
arc-swap        = { workspace = true }
lru             = { workspace = true }
metrics         = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
metrics-util    = { workspace = true }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
async-compression = { version = "0.4.42", features = ["tokio", "gzip"] }

[features]
dev = ["corevia-talk-auth/dev"]

[dev-dependencies]
# Generate ephemeral P-256 signing fixtures; already in the runtime dependency graph.
ring = "0.17"
# The mesh-llm smoke harnesses moved to `crates/corevia-talk-mesh-smoke`. A
# dev-dependency feeds every target of its package, so keeping the mesh-llm
# SDK here forced the entire mesh-llm/skippy/rmcp tree to compile before any
# relay unit test could build — the Desktop E2E Relay 30m timeout.
# `use_pem` enables EncodingKey::from_ec_pem for minting ES256 test assertions
# in settings_tests.rs (key-pairing build_router tests).
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
http-body = "1"
http-body-util = "0.1"
corevia-talk-core = { workspace = true, features = ["test-utils"] }
corevia-talk-auth = { workspace = true, features = ["dev", "test-utils"] }
reqwest = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
futures = "0.3"
flate2 = "1.1.9"
opentelemetry_sdk = { workspace = true, features = ["testing"] }
