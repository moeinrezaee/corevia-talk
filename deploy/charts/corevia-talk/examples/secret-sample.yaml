# Sample Secret matching `secrets.existingSecret: corevia-talk-secrets`.
#
# Manage this via SealedSecrets / SOPS / External Secrets / Vault — anything
# that keeps the unencrypted form out of git. The chart reads keys it finds
# and leaves the rest as Pod env vars marked `optional: true`.
#
# Keys consumed by the relay (all optional unless required by relay config):
#   COREVIA_TALK_RELAY_PRIVATE_KEY        — 64-char hex; relay identity (do NOT rotate)
#   COREVIA_TALK_GIT_HOOK_HMAC_SECRET     — 32+ chars; required when replicaCount > 1
#   DATABASE_URL                  — postgres://...
#   READ_DATABASE_URL             — postgres://... (optional read-replica; omit to disable read routing)
#   REDIS_URL                     — redis://...  (required when replicaCount > 1)
#   COREVIA_TALK_S3_ACCESS_KEY
#   COREVIA_TALK_S3_SECRET_KEY
#   COREVIA_TALK_KLIPY_API_KEY            — omit to disable relay-proxied GIF search
apiVersion: v1
kind: Secret
metadata:
  name: corevia-talk-secrets
  namespace: corevia-talk
type: Opaque
stringData:
  COREVIA_TALK_RELAY_PRIVATE_KEY: "REPLACE_WITH_64_HEX"
  COREVIA_TALK_GIT_HOOK_HMAC_SECRET: "REPLACE_WITH_RANDOM_64_CHARS"
  DATABASE_URL: "postgres://corevia_talk:REPLACE@postgres.corevia_talk.svc.cluster.local:5432/corevia_talk?sslmode=require"
  REDIS_URL: "redis://:REPLACE@redis.corevia-talk.svc.cluster.local:6379"
  COREVIA_TALK_S3_ACCESS_KEY: "REPLACE"
  COREVIA_TALK_S3_SECRET_KEY: "REPLACE"
  COREVIA_TALK_KLIPY_API_KEY: "REPLACE"
