# HA shape: replicas=3 + Redis + RWO git (object-store-backed; no RWM). Render-only check.
relayUrl: wss://corevia-talk.example.com
ownerPubkey: "abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789"
replicaCount: 3
secrets:
  existingSecret: corevia-talk-secrets
externalPostgresql:
  url: "postgres://corevia_talk:pw@postgres.example.com:5432/corevia_talk"
externalRedis:
  url: "redis://:pw@redis.example.com:6379"
s3:
  bucket: "corevia-talk-media"
persistence:
  git:
    enabled: true
    accessMode: ReadWriteOnce
    size: 50Gi
podDisruptionBudget:
  enabled: true
  minAvailable: 2
