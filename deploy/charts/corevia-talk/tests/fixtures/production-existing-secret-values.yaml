# Production / GitOps shape: external services, existingSecret. Renders only;
# `ct install` is not asked to satisfy the external services.
relayUrl: wss://corevia-talk.example.com
ownerPubkey: "abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789"
secrets:
  existingSecret: corevia-talk-secrets
externalPostgresql:
  url: "postgres://corevia_talk:pw@postgres.example.com:5432/corevia_talk"
externalRedis:
  url: "redis://:pw@redis.example.com:6379"
operatorJobs:
  deletionDrain:
    enabled: true
s3:
  endpoint: "https://s3.us-east-1.amazonaws.com"
  bucket: "corevia-talk-media"
persistence:
  git:
    enabled: true
    accessMode: ReadWriteOnce
    size: 50Gi
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
podDisruptionBudget:
  enabled: false
