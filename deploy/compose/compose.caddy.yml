services:
  relay:
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    depends_on:
      relay:
        condition: service_healthy
    environment:
      COREVIA_TALK_DOMAIN: ${COREVIA_TALK_DOMAIN:?set COREVIA_TALK_DOMAIN}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - corevia-talk-caddy-data:/data
      - corevia-talk-caddy-config:/config
    restart: unless-stopped
    networks:
      - corevia-talk-net

volumes:
  corevia-talk-caddy-data:
    labels:
      com.coreviatalk.volume: caddy-data
  corevia-talk-caddy-config:
    labels:
      com.coreviatalk.volume: caddy-config
