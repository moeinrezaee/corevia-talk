name: corevia-talk

services:
  postgres:
    image: postgres:17-alpine
    container_name: corevia-talk-postgres
    environment:
      POSTGRES_USER: corevia_talk
      POSTGRES_PASSWORD: corevia_talk_dev
      POSTGRES_DB: corevia_talk
      PGDATA: /var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - corevia-talk-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corevia_talk"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m
    labels:
      com.coreviatalk.service: "postgres"
      com.coreviatalk.env: "dev"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: corevia-talk-redis
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - corevia-talk-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128m
    labels:
      com.coreviatalk.service: "redis"
      com.coreviatalk.env: "dev"
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: corevia-talk-adminer
    ports:
      - "127.0.0.1:8082:8080"
    networks:
      - corevia-talk-net
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    deploy:
      resources:
        limits:
          memory: 64m
    labels:
      com.coreviatalk.service: "adminer"
      com.coreviatalk.env: "dev"
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: corevia-talk-keycloak
    command: start-dev --http-port=8080
    environment:
      KC_DB: dev-mem
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:8180:8080"
    networks:
      - corevia-talk-net
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
    labels:
      com.coreviatalk.service: "keycloak"
      com.coreviatalk.env: "dev"
    restart: unless-stopped

  minio:
    # Silo preserves the MinIO configuration and health endpoints.
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    container_name: corevia-talk-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: corevia_talk_dev
      MINIO_ROOT_PASSWORD: corevia_talk_dev_secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - corevia-talk-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m
    labels:
      com.coreviatalk.service: "minio"
      com.coreviatalk.env: "dev"
    restart: unless-stopped

  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
    container_name: corevia-talk-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - corevia-talk-net
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 corevia_talk_dev corevia_talk_dev_secret &&
        mc mb --ignore-existing local/corevia-talk-media &&
        mc anonymous set none local/corevia-talk-media
      "
    labels:
      com.coreviatalk.service: "minio-init"
      com.coreviatalk.env: "dev"
    restart: "no"

  prometheus:
    image: prom/prometheus:latest
    container_name: corevia-talk-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - corevia-talk-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 128m
    labels:
      com.coreviatalk.service: "prometheus"
      com.coreviatalk.env: "dev"
    restart: unless-stopped

volumes:
  postgres-data:
    name: corevia-talk-postgres-data
    labels:
      com.coreviatalk.volume: "postgres"
  minio-data:
    name: corevia-talk-minio-data
    labels:
      com.coreviatalk.volume: "minio"
  prometheus-data:
    name: corevia-talk-prometheus-data
    labels:
      com.coreviatalk.volume: "prometheus"

networks:
  corevia-talk-net:
    name: corevia-talk-net
    driver: bridge
    labels:
      com.coreviatalk.network: "dev"
