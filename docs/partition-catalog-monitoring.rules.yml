# Alert rules from docs/partition-catalog-monitoring.md. Keep them identical to
# the doc; partition-catalog-monitoring.rules.test.yml tests them.
groups:
  - name: corevia-talk-partition-catalog
    rules:
      - alert: CoreviaTalkPartitionAuditStale
        expr: time() - corevia_talk_partition_audit_last_success_timestamp_seconds > 1800
        for: 10m

      - alert: CoreviaTalkPartitionAuditNotRunning
        expr: |
          sum without (outcome) (increase(corevia_talk_partition_audit_runs_total[30m])) == 0
            and sum without (outcome) (corevia_talk_partition_audit_runs_total)
            and sum without (outcome) (corevia_talk_partition_audit_runs_total offset 30m)
        for: 5m

      - alert: CoreviaTalkPartitionAuditFailing
        expr: |
          increase(corevia_talk_partition_audit_failures_total[1h]) >= 2
            and corevia_talk_partition_audit_failures_total
