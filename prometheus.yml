# Local dev Prometheus config — scrapes corevia-talk-relay metrics.
# The relay runs on the host (not in Docker), so we use host.docker.internal.
# Default metrics port is 9102; override with COREVIA_TALK_METRICS_PORT.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: corevia-talk-relay
    static_configs:
      - targets: ["host.docker.internal:9102"]
